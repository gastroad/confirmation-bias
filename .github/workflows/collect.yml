name: Collect (RSS → DB)

on:
  # 3시간마다. Supabase egress 때문에 6시간으로 늦춰뒀던 것을 Neon 이관(2026-08-24)으로 되돌렸다.
  # 주기가 길면 RSS 피드에서 항목이 밀려 나가 수집을 놓친다.
  # 정각(:00)은 GitHub 부하로 지연·드롭이 잦아 :17로 오프셋.
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # 임베딩·클러스터링은 하지 않으므로 OPENAI_API_KEY가 필요 없다.
      - name: Collect RSS
        run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
